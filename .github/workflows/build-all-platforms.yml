name: Build Multi-Platform Apps (Windows, Android, iOS, macOS, Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS DESKTOP BUILD (.exe & .msi)
  # =========================================================================
  build-windows:
    name: Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Windows Installers (NSIS EXE & MSI)
        run: npx electron-builder --win nsis msi portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Windows-Binaries
          path: |
            dist/*.exe
            dist/*.msi

  # =========================================================================
  # 2. ANDROID MOBILE BUILD (.apk)
  # =========================================================================
  build-android:
    name: Android (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  # =========================================================================
  # 3. LINUX DESKTOP BUILD (.deb, .rpm, .AppImage, .snap)
  # =========================================================================
  build-linux:
    name: Linux (.deb, .rpm, .AppImage, .snap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libarchive-tools snapd

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Linux Packages
        run: npx electron-builder --linux deb rpm AppImage snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Linux-Packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.snap

  # =========================================================================
  # 4. MACOS APPLE SILICON & IOS BUILD (.dmg & .ipa)
  # =========================================================================
  build-macos-ios:
    name: macOS (Apple Silicon .dmg) & iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build macOS Apple Silicon (.dmg & .app)
        run: npx electron-builder --mac dmg zip --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize iOS Capacitor Project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Upload macOS & iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-macOS-iOS-Binaries
          path: |
            dist/*.dmg
            dist/*.zip
            ios/

  # =========================================================================
  # 5. AUTOMATED GITHUB RELEASE PUBLISHER
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-linux, build-macos-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LightShare-Windows-Binaries
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LightShare-Android-APK
          path: release-assets/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LightShare-Linux-Packages
          path: release-assets/linux

      - name: Download macOS & iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LightShare-macOS-iOS-Binaries
          path: release-assets/mac-ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "LightShare V1.0 - Universal Cross-Platform Release"
          body: |
            ## 🚀 LightShare V1.0 Universal Release
            High-speed 30GB+ file transfers over local Wi-Fi and Hotspot with 0 data usage.
            
            ### 📦 Download Formats Available:
            - **Windows**: `LightShare-Setup.exe` (NSIS) & `LightShare-Setup.msi`
            - **Android**: `LightShare.apk`
            - **macOS (Apple Silicon)**: `LightShare-AppleSilicon.dmg`
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), `.AppImage`, and `.snap`
            - **iOS**: Capacitor iOS workspace
          files: |
            release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
