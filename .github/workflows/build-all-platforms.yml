name: Build Multi-Platform Apps (Windows, Android, iOS, macOS, Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS DESKTOP BUILD (.exe & .msi)
  # =========================================================================
  build-windows:
    name: Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows Installers (NSIS EXE & Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Windows-Binaries
          if-no-files-found: warn
          path: |
            dist/*.exe

  # =========================================================================
  # 2. ANDROID MOBILE BUILD (.apk)
  # =========================================================================
  build-android:
    name: Android (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug & Release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
          mkdir -p ../dist-apk
          
          # 1. Copy debug APK (already signed by Android Gradle debug key)
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} ../dist-apk/LightShare-Debug.apk \;
          
          # 2. Sign Release APK so it installs cleanly on all Android phones
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            echo "Signing Release APK: $UNSIGNED_APK"
            keytool -genkey -v -keystore release.keystore -alias lightshare -keyalg RSA -keysize 2048 -validity 10000 -storepass lightshare123 -keypass lightshare123 -dname "CN=LightShare, OU=Mobile, O=LightShare, L=City, S=State, C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass lightshare123 -keypass lightshare123 "$UNSIGNED_APK" lightshare
            cp "$UNSIGNED_APK" ../dist-apk/LightShare-Release.apk
          fi

      - name: Upload Android APK Artifacts (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Android-APKs
          if-no-files-found: warn
          path: |
            dist-apk/*.apk
            android/app/build/outputs/apk/**/*.apk

  # =========================================================================
  # 3. LINUX DESKTOP BUILD (.deb, .rpm, .AppImage)
  # =========================================================================
  build-linux:
    name: Linux (.deb, .rpm, .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libarchive-tools

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Linux Packages
        run: npx electron-builder --linux deb rpm AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-Linux-Packages
          if-no-files-found: warn
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  # =========================================================================
  # 4. MACOS APPLE SILICON BUILD (.dmg & .zip)
  # =========================================================================
  build-macos:
    name: macOS (Universal & Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS Universal & Apple Silicon (.dmg & .zip)
        run: npx electron-builder --mac dmg zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightShare-macOS-Binaries
          if-no-files-found: warn
          path: |
            dist/*.dmg
            dist/*.zip

  # =========================================================================
  # 5. AUTOMATIC GITHUB RELEASE PUBLISHER (Triggered Automatically on 100% Green Builds!)
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LightShare-Windows-Binaries
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LightShare-Android-APKs
          path: release-assets/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LightShare-Linux-Packages
          path: release-assets/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LightShare-macOS-Binaries
          path: release-assets/mac

      - name: Create or Update Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "LightShare V1.0 - Official Universal Release"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            # 🚀 LightShare V1.0 - Universal Multi-Platform App & SaaS
            
            Ultra-modern, high-speed **30GB+ file transfers** over local Wi-Fi and Personal Hotspot with **0 Internet Data Usage**.
            
            ---
            
            ### 📦 Download Packages:
            - **📱 Android**: `LightShare-Debug.apk` & `LightShare-Release.apk` (All architectures: arm64-v8a, armeabi-v7a, x86_64, x86)
            - **💻 Windows**: `LightShare-Setup-x64.exe`, `LightShare-Setup-ia32.exe`, `LightShare-Setup-arm64.exe` & Portable `.exe`
            - **🍏 macOS**: `LightShare-macOS-universal.dmg`, `LightShare-macOS-arm64.dmg` (Apple Silicon & Intel)
            - **🐧 Linux**: `.deb` (Ubuntu/Debian), `.rpm` (Fedora/RHEL), and `.AppImage` (Universal portable)
            
            ---
            
            ### 👨‍💻 Developer & Support:
            - **Lead Developer**: Tanmaya Mahapatra (Retired AME)
            - **Support**: `dronalabs.support@gmail.com`
            - **Package ID**: `com.lightshare.transfer.app`
          files: |
            release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
